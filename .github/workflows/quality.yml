name: Portfolio quality and security
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
